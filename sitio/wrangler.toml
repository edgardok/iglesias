# Worker (generado por el adaptador de Astro) + assets estáticos. Plan gratuito: hasta 20.000 archivos estáticos;
# por eso las 32.000 fichas y las localidades se renderizan en el Worker desde D1 en vez de generarse como HTML.
name = "iglesias"
main = "./dist/_worker.js/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# wrangler corre esto antes de cada deploy.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "iglesias"
database_id = "511d35ed-fb42-40c1-9f3a-89c90f61d852"

# Secretos (ya cargados con `wrangler secret put`): TURNSTILE_SECRET_KEY, AGENTE_TOKEN
# Variable de build opcional: SITE_URL
