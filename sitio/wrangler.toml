# Cloudflare Worker con assets estáticos (hasta 100.000 archivos; Pages se queda en 20.000 y el sitio tiene ~42.000).
name = "iglesias"
main = "worker/index.ts"
compatibility_date = "2026-01-01"

# wrangler corre esto antes de cada deploy, así el sitio se genera aunque el panel no tenga build command.
[build]
command = "npm run build"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Crear la base:        npx wrangler d1 create iglesias   (pegar el database_id acá)
# Aplicar el esquema:   npx wrangler d1 execute iglesias --file=schema.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "iglesias"
database_id = "511d35ed-fb42-40c1-9f3a-89c90f61d852"

# Secretos:  npx wrangler secret put TURNSTILE_SECRET_KEY ; npx wrangler secret put AGENTE_TOKEN
# Variable de build para Astro: PUBLIC_TURNSTILE_SITE_KEY (clave pública de Turnstile)
